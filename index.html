<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>opentask</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <aside class="sidebar">
        <h1 class="logo">opentask</h1>
        
        <div class="form-group">
            <input type="text" id="taskTitle" placeholder="O que precisa ser feito?" autocomplete="off">
            <textarea id="taskDesc" placeholder="Detalhes (opcional)" rows="3"></textarea>
            
            <div class="row">
                <input type="date" id="taskDate" class="date-input" title="Data de conclusão">
                <div class="category-wrapper">
                    <select id="taskCategory"></select>
                    <button id="addCategoryBtn" class="icon-btn" title="Nova Categoria">+</button>
                    <button id="delCategoryBtn" class="icon-btn" title="Apagar Categoria Atual">−</button>
                </div>
            </div>
            
            <button id="addTaskBtn" class="btn-add">Adicionar</button>
        </div>
    </aside>

    <main class="main-content">
        <header class="top-bar">
            <div class="filters">
                <button class="filter-btn active" data-filter="all">Todas</button>
                <button class="filter-btn" data-filter="pending">Pendentes</button>
                <button class="filter-btn" data-filter="completed">Concluídas</button>
            </div>
            <input type="text" id="searchInput" placeholder="🔍 Buscar tarefas" autocomplete="off">
            <button id="clearCompletedBtn" class="btn-clear">Limpar Concluídas</button>
        </header>

        <ul id="taskList" class="task-list"></ul>
    </main>

    <!-- Modal de Edição -->
    <div id="editModal" class="modal hidden">
        <div class="modal-content">
            <h2>Editar Tarefa</h2>
            <input type="text" id="editTitle" placeholder="Título">
            <textarea id="editDesc" placeholder="Detalhes" rows="3"></textarea>
            <div class="row">
                <input type="date" id="editDate">
                <select id="editCategory"></select>
            </div>
            <div class="modal-actions">
                <button id="cancelEditBtn" class="btn-cancel">Cancelar</button>
                <button id="saveEditBtn" class="btn-save">Salvar</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
