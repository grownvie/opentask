<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>opentask</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <aside class="sidebar">
        <h1 class="logo">opentask</h1>
        
        <div class="form-group">
            <div class="input-wrapper">
                <i data-lucide="type" class="input-icon"></i>
                <input type="text" id="taskTitle" placeholder="O que precisa ser feito?" autocomplete="off">
            </div>
            
            <textarea id="taskDesc" placeholder="Detalhes (opcional)" rows="3"></textarea>
            
            <div class="row">
                <div class="input-wrapper flex-1">
                    <i data-lucide="calendar" class="input-icon"></i>
                    <input type="date" id="taskDate" class="date-input">
                </div>
                
                <div class="input-wrapper category-input flex-2">
                    <i data-lucide="tag" class="input-icon"></i>
                    <select id="taskCategory"></select>
                </div>
                
                <!-- Botão mantido no DOM (o JS precisa dele), mas invisível -->
                <button type="button" id="addCategoryBtn" class="icon-btn-hidden" aria-hidden="true" tabindex="-1">
                    <i data-lucide="plus"></i>
                </button>
            </div>
            
            <button id="addTaskBtn" class="btn-add">
                <i data-lucide="plus"></i> Adicionar
            </button>
        </div>
    </aside>

    <main class="main-content">
        <header class="top-bar">
            <div class="search-wrapper">
                <i data-lucide="search" class="search-icon"></i>
                <input type="text" id="searchInput" placeholder="Buscar tarefas" autocomplete="off">
            </div>
            <div class="controls-row">
                <div class="filters">
                    <button class="filter-btn active" data-filter="all">Todas</button>
                    <button class="filter-btn" data-filter="pending">Pendentes</button>
                    <button class="filter-btn" data-filter="completed">Concluídas</button>
                </div>
                <button id="clearCompletedBtn" class="btn-clear">
                    <i data-lucide="trash-2"></i> Limpar Concluídas
                </button>
            </div>
        </header>

        <ul id="taskList" class="task-list"></ul>
    </main>

    <div id="editModal" class="modal hidden">
        <div class="modal-content">
            <h2>Editar Tarefa</h2>
            <div class="input-wrapper">
                <i data-lucide="type" class="input-icon"></i>
                <input type="text" id="editTitle" placeholder="Título">
            </div>
            <textarea id="editDesc" placeholder="Detalhes" rows="3"></textarea>
            <div class="row">
                <div class="input-wrapper flex-1">
                    <i data-lucide="calendar" class="input-icon"></i>
                    <input type="date" id="editDate">
                </div>
                <select id="editCategory" class="flex-2"></select>
            </div>
            <div class="modal-actions">
                <button id="cancelEditBtn" class="btn-cancel">Cancelar</button>
                <button id="saveEditBtn" class="btn-save">Salvar</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>

    <!-- ===== Script complementar: adiciona "+ Nova Categoria" dentro do select ===== -->
    <!-- NÃO modifica o script.js — apenas usa o botão #addCategoryBtn que já existe -->
    <script>
        (function () {
            const ADD_NEW_VALUE = '__new_category__';

            function ensureAddOption() {
                const select = document.getElementById('taskCategory');
                if (!select) return;

                // Remove a opção especial antiga (se existir) para evitar duplicatas
                select.querySelectorAll(`option[value="${ADD_NEW_VALUE}"]`).forEach(o => o.remove());

                const option = document.createElement('option');
                option.value = ADD_NEW_VALUE;
                option.textContent = '+  Nova Categoria';
                option.style.color = '#4c6ef5';
                option.style.fontWeight = '600';
                select.appendChild(option);
            }

            document.addEventListener('DOMContentLoaded', () => {
                const select = document.getElementById('taskCategory');
                const addBtn = document.getElementById('addCategoryBtn');
                if (!select || !addBtn) return;

                ensureAddOption();

                // Sempre que o script.js recriar as opções, re-adicionamos a nossa
                new MutationObserver(ensureAddOption).observe(select, { childList: true });

                // Ao selecionar "+ Nova Categoria", dispara o botão oculto (que abre o prompt)
                select.addEventListener('change', (e) => {
                    if (e.target.value === ADD_NEW_VALUE) {
                        const previous = select.dataset.prevValue || '';
                        addBtn.click(); // Abre o prompt() do script.js

                        // prompt() é bloqueante — o código abaixo só roda depois que o usuário responder
                        if (select.value === ADD_NEW_VALUE) {
                            // Usuário cancelou → restaura seleção anterior
                            select.value = previous;
                        } else {
                            // Categoria criada com sucesso → guarda como valor anterior
                            select.dataset.prevValue = select.value;
                        }
                    } else {
                        select.dataset.prevValue = e.target.value;
                    }
                });
            });
        })();
    </script>
</body>
</html>
