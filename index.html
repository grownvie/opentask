<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="OpenTask: gerenciador de tarefas simples que salva tudo no seu navegador.">
    <title>OpenTask</title>
    <link rel="icon" href="favicon.png" type="image/png">

    <!-- Fontes: uma única requisição para Inter, Onest e Instrument Serif -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Instrument+Serif:ital@0;1&family=Onest:wght@100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <!-- Versão fixa do Lucide. Se mudar a versão, confira se todos os ícones continuam aparecendo. -->
    <script src="https://unpkg.com/lucide@0.383.0" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <aside class="sidebar">
        <h1 class="logo">opentask</h1>

        <div class="form-group">
            <div class="input-wrapper">
                <label class="sr-only" for="taskTitle">Título da tarefa</label>
                <i data-lucide="type" class="input-icon"></i>
                <input type="text" id="taskTitle" placeholder="O que precisa ser feito?" autocomplete="off">
            </div>

            <label class="sr-only" for="taskDesc">Detalhes da tarefa</label>
            <textarea id="taskDesc" placeholder="Detalhes (opcional)" rows="3"></textarea>

            <div class="row">
                <div class="input-wrapper date-field">
                    <label class="sr-only" for="taskDate">Data</label>
                    <i data-lucide="calendar" class="input-icon"></i>
                    <input type="date" id="taskDate" class="date-input">
                </div>

                <div class="custom-select category-field">
                    <span id="categoryLabel" class="sr-only">Categoria:</span>
                    <i data-lucide="tag" class="input-icon"></i>
                    <button type="button" class="custom-select-trigger" id="categoryTrigger"
                            aria-haspopup="listbox" aria-expanded="false" aria-controls="categoryOptions"
                            aria-labelledby="categoryLabel categoryDisplay">
                        <span id="categoryDisplay">Sem categoria</span>
                        <i data-lucide="chevron-down" class="chevron"></i>
                    </button>
                    <select id="taskCategory" class="native-select-hidden" tabindex="-1" aria-hidden="true"></select>
                    <div class="custom-select-options hidden" id="categoryOptions" role="listbox" aria-label="Categorias"></div>
                </div>
            </div>

            <button type="button" id="addTaskBtn" class="btn-add">
                <i data-lucide="plus"></i> Adicionar
            </button>
        </div>
    </aside>

    <main class="main-content">
        <header class="top-bar">
            <div class="search-wrapper">
                <label class="sr-only" for="searchInput">Buscar tarefas</label>
                <i data-lucide="search" class="search-icon"></i>
                <input type="text" id="searchInput" placeholder="Buscar tarefas" autocomplete="off">
            </div>
            <div class="controls-row">
                <div class="filters" role="group" aria-label="Filtrar tarefas">
                    <button type="button" class="filter-btn active" data-filter="all" aria-pressed="true">Todas</button>
                    <button type="button" class="filter-btn" data-filter="pending" aria-pressed="false">Pendentes</button>
                    <button type="button" class="filter-btn" data-filter="completed" aria-pressed="false">Concluídas</button>
                </div>
                <button type="button" id="clearCompletedBtn" class="btn-clear">
                    <i data-lucide="trash-2"></i> Limpar Concluídas
                </button>
            </div>
        </header>

        <ul id="taskList" class="task-list"></ul>
    </main>

    <div id="editModal" class="modal hidden">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
            <h2 id="editModalTitle">Editar Tarefa</h2>
            <div class="input-wrapper">
                <label class="sr-only" for="editTitle">Título</label>
                <i data-lucide="type" class="input-icon"></i>
                <input type="text" id="editTitle" placeholder="Título" autocomplete="off">
            </div>
            <label class="sr-only" for="editDesc">Detalhes</label>
            <textarea id="editDesc" placeholder="Detalhes" rows="3"></textarea>
            <div class="row">
                <div class="input-wrapper flex-1">
                    <label class="sr-only" for="editDate">Data</label>
                    <i data-lucide="calendar" class="input-icon"></i>
                    <input type="date" id="editDate">
                </div>
                <div class="custom-select compact edit-category-field flex-2">
                    <span id="editCategoryLabel" class="sr-only">Categoria:</span>
                    <i data-lucide="tag" class="input-icon"></i>
                    <button type="button" class="custom-select-trigger" id="editCategoryTrigger"
                            aria-haspopup="listbox" aria-expanded="false" aria-controls="editCategoryOptions"
                            aria-labelledby="editCategoryLabel editCategoryDisplay">
                        <span id="editCategoryDisplay">Sem categoria</span>
                        <i data-lucide="chevron-down" class="chevron"></i>
                    </button>
                    <select id="editCategory" class="native-select-hidden" tabindex="-1" aria-hidden="true"></select>
                    <div class="custom-select-options hidden" id="editCategoryOptions" role="listbox" aria-label="Categorias"></div>
                </div>
            </div>
            <div class="modal-actions">
                <button type="button" id="cancelEditBtn" class="btn-cancel">Cancelar</button>
                <button type="button" id="saveEditBtn" class="btn-save">Salvar</button>
            </div>
        </div>
    </div>
</body>
</html>
