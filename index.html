<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>opentask</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <aside class="sidebar">
        <h1 class="logo">opentask</h1>
        
        <div class="form-group">
            <div class="input-wrapper">
                <i data-lucide="type" class="input-icon"></i>
                <input type="text" id="taskTitle" placeholder="O que precisa ser feito?" autocomplete="off">
            </div>
            
            <textarea id="taskDesc" placeholder="Detalhes (opcional)" rows="3"></textarea>
            
            <div class="row">
                <div class="input-wrapper flex-1">
                    <i data-lucide="calendar" class="input-icon"></i>
                    <input type="date" id="taskDate" class="date-input" title="Data de conclusão">
                </div>
                
                <div class="category-group flex-2">
                    <div class="input-wrapper">
                        <i data-lucide="tag" class="input-icon"></i>
                        <select id="taskCategory"></select>
                    </div>
                    <button id="addCategoryBtn" class="icon-btn" title="Nova Categoria">
                        <i data-lucide="plus"></i>
                    </button>
                </div>
            </div>
            
            <button id="addTaskBtn" class="btn-add">
                <i data-lucide="plus"></i> Adicionar
            </button>
        </div>
    </aside>

    <main class="main-content">
        <header class="top-bar">
    <div class="search-wrapper">
        <i data-lucide="search" class="search-icon"></i>
        <input type="text" id="searchInput" placeholder="Buscar tarefas" autocomplete="off">
    </div>
    <div class="controls-row">
        <div class="filters">
            <button class="filter-btn active" data-filter="all">Todas</button>
            <button class="filter-btn" data-filter="pending">Pendentes</button>
            <button class="filter-btn" data-filter="completed">Concluídas</button>
        </div>
        <button id="clearCompletedBtn" class="btn-clear">
            <i data-lucide="trash-2"></i> Limpar Concluídas
        </button>
    </div>
</header>

        <ul id="taskList" class="task-list"></ul>
    </main>

    <div id="editModal" class="modal hidden">
        <div class="modal-content">
            <h2>Editar Tarefa</h2>
            <div class="input-wrapper">
                <i data-lucide="type" class="input-icon"></i>
                <input type="text" id="editTitle" placeholder="Título">
            </div>
            <textarea id="editDesc" placeholder="Detalhes" rows="3"></textarea>
            <div class="row">
                <div class="input-wrapper flex-1">
                    <i data-lucide="calendar" class="input-icon"></i>
                    <input type="date" id="editDate">
                </div>
                <select id="editCategory" class="flex-2"></select>
            </div>
            <div class="modal-actions">
                <button id="cancelEditBtn" class="btn-cancel">Cancelar</button>
                <button id="saveEditBtn" class="btn-save">Salvar</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
